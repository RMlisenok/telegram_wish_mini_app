<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Telegram Mini App - Анкета</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .state { display: none; }
        .show { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; background: #0088cc; color: white; margin-top: 10px; }
        .tag-item { display: flex; gap: 5px; margin-bottom: 5px; }
        .tag-item input:first-child { flex: 1; }
        .tag-item input:last-child { flex: 2; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="state show">Загрузка...</div>

        <div id="main-app" class="state">
            <h1>🎁 Моя Анкета</h1>

            <div id="display-section" style="display: none;">
                <h3>Ваши предпочтения:</h3>
                <div id="current-data"></div>
                <button onclick="showEditForm()">✏️ Редактировать</button>
            </div>

            <div id="form-section">
                <h3>Заполните анкету</h3>
                <p style="font-size: 12px; color: #666;">Укажите минимум 3 интереса и 1 вещь, которую не стоит дарить.</p>

                <div class="form-group">
                    <label>🌟 Интересы (минимум 3)</label>
                    <div id="interests-list">
                        </div>
                    <button type="button" onclick="addField('interests-list')">+ Добавить интерес</button>
                </div>

                <div class="form-group">
                    <label>❌ Не дарить (минимум 1)</label>
                    <div id="avoid-list">
                        </div>
                    <button type="button" onclick="addField('avoid-list')">+ Добавить исключение</button>
                </div>

                <button id="save-btn" onclick="handleSave()" style="width: 100%; background: #28a745;">💾 Сохранить анкету</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API_BASE = "https://api.podarimne.ru/v1"; // Из api.yaml
        let userToken = localStorage.getItem('auth_token');
        let isUpdate = false;

        async function init() {
            tg.expand();
            if (!userToken) {
                await authenticate();
            }
            await loadQuestionnaire();
        }

        // Авторизация согласно AuthRequest в YAML
        async function authenticate() {
            try {
                const response = await fetch(`${API_BASE}/auth/telegram`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData: tg.initData,
                        user: tg.initDataUnsafe.user
                    })
                });
                const data = await response.json();
                if (data.token) {
                    userToken = data.token;
                    localStorage.setItem('auth_token', userToken);
                }
            } catch (e) {
                alert("Ошибка авторизации");
            }
        }

        function addField(containerId, tag = '', details = '') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'tag-item';
            div.innerHTML = `
                <input type="text" placeholder="Тег (напр. Кино)" value="${tag}" maxlength="25">
                <input type="text" placeholder="Детали (напр. Люблю Marvel)" value="${details}" maxlength="100">
                <button onclick="this.parentElement.remove()" style="background:red">×</button>
            `;
            container.appendChild(div);
        }

        async function loadQuestionnaire() {
            document.getElementById('loading').classList.add('show');
            try {
                const response = await fetch(`${API_BASE}/questionnaire`, {
                    headers: { 'Authorization': `Bearer ${userToken}` }
                });

                if (response.status === 200) {
                    const data = await response.json();
                    renderDisplay(data);
                    fillForm(data);
                    isUpdate = true;
                } else {
                    // Если 404, показываем пустую форму
                    isUpdate = false;
                    setupEmptyForm();
                }
            } catch (e) {
                setupEmptyForm();
            }
            document.getElementById('loading').classList.remove('show');
            document.getElementById('main-app').classList.add('show');
        }

        function setupEmptyForm() {
            document.getElementById('form-section').style.display = 'block';
            for(let i=0; i<3; i++) addField('interests-list');
            addField('avoid-list');
        }

        function fillForm(data) {
            document.getElementById('interests-list').innerHTML = '';
            document.getElementById('avoid-list').innerHTML = '';
            data.interests.forEach(item => addField('interests-list', item.tag, item.details));
            data.avoid_gifts.forEach(item => addField('avoid-list', item.tag, item.details));
        }

        function renderDisplay(data) {
            const display = document.getElementById('current-data');
            let html = '<h4>Интересы:</h4><ul>';
            data.interests.forEach(i => html += `<li><b>${i.tag}</b>: ${i.details || ''}</li>`);
            html += '</ul><h4>Не дарить:</h4><ul>';
            data.avoid_gifts.forEach(i => html += `<li><b>${i.tag}</b>: ${i.details || ''}</li>`);
            html += '</ul>';
            display.innerHTML = html;
            document.getElementById('display-section').style.display = 'block';
            document.getElementById('form-section').style.display = 'none';
        }

        function showEditForm() {
            document.getElementById('display-section').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
        }

        async function handleSave() {
            const interests = collectData('interests-list');
            const avoid_gifts = collectData('avoid-list');

            // Валидация согласно схеме YAML (minItems)
            if (interests.length < 3) return alert("Нужно минимум 3 интереса");
            if (avoid_gifts.length < 1) return alert("Укажите хотя бы один нежелательный подарок");

            const payload = { interests, avoid_gifts };
            const method = isUpdate ? 'PUT' : 'POST'; // YAML поддерживает оба метода

            try {
                const response = await fetch(`${API_BASE}/questionnaire`, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${userToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    tg.showAlert("Анкета сохранена!");
                    loadQuestionnaire();
                } else {
                    const err = await response.json();
                    alert("Ошибка: " + (err.detail || "Проверьте данные"));
                }
            } catch (e) {
                alert("Ошибка сети");
            }
        }

        function collectData(containerId) {
            const items = [];
            document.querySelectorAll(`#${containerId} .tag-item`).forEach(div => {
                const inputs = div.querySelectorAll('input');
                if (inputs[0].value.trim()) {
                    items.push({
                        tag: inputs[0].value.trim(),
                        details: inputs[1].value.trim() || null
                    });
                }
            });
            return items;
        }

        init();
    </script>
</body>
</html>
