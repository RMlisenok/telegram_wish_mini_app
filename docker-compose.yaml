version: '3.5'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    expose:
      - "80"
    environment:
      - DOMAIN=wishlistprice.ru
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend-app
    env_file:
      - backend/.env
    expose:
      - "8000"
    # volumes:
    #   - ./backend:/app
    depends_on:
      - database
    networks:
      - app-network
    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
      "

  database:
    image: postgres:15
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: telegram_app_db
    ports:
      - "5437:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/runner/ssl/certbot/www:/var/www/certbot
      - /home/runner/ssl/certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /home/runner/ssl/certbot/conf:/etc/letsencrypt
      - /home/runner/ssl/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  database-data:
