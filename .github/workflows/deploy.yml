name: Deploy with SSL

on:
  push:
    branches: [ "app_integration_into_tg" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          mkdir -p backend
          cat > backend/.env << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          ENDPOINT_URL=${{ secrets.ENDPOINT_URL }}
          BUCKET_NAME=${{ secrets.BUCKET_NAME }}
          URL_DATA_SAVE=${{ secrets.URL_DATA_SAVE }}
          EOF

      - name: Create necessary directories
        run: |
          mkdir -p certbot/{conf,www}
          mkdir -p nginx

      - name: Check if certificates exist
        id: check-certs
        run: |
          if [ -f certbot/conf/live/wishlistprice.ru/fullchain.pem ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Certificates found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No certificates found, will obtain new ones"
          fi

      - name: Stop services if running
        run: |
          docker-compose down || true

      - name: Obtain SSL certificates (first time)
        if: steps.check-certs.outputs.exists == 'false'
        run: |
          chmod +x scripts/init-certs.sh
          ./scripts/init-certs.sh

      - name: Update certificates if needed
        if: steps.check-certs.outputs.exists == 'true'
        run: |
          docker run --rm \
            -v $(pwd)/certbot/conf:/etc/letsencrypt \
            -v $(pwd)/certbot/www:/var/www/certbot \
            certbot/certbot renew --webroot -w /var/www/certbot --dry-run

      - name: Deploy with docker-compose
        run: |
          docker-compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 15

      - name: Health check
        run: |
          # Check nginx
          if curl -k -f https://wishlistprice.ru/health; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            docker-compose logs
            exit 1
          fi

      - name: Verify SSL certificate
        run: |
          # Check SSL certificate expiry
          expiry_date=$(docker run --rm \
            -v $(pwd)/certbot/conf:/etc/letsencrypt \
            certbot/certbot certificates \
            | grep -A 2 "wishlistprice.ru" \
            | grep "Expiry Date" \
            | awk -F'Expiry Date: ' '{print $2}')
          
          echo "📅 Certificate expires on: $expiry_date"

      - name: Cleanup
        if: always()
        run: |
          rm -f backend/.env
          docker system prune -f

      - name: Setup auto-renewal cron job
        run: |
          # Add cron job for certificate renewal (if not exists)
          (crontab -l 2>/dev/null | grep -v "certbot renew") | crontab -
          (crontab -l 2>/dev/null; echo "0 0,12 * * * cd $(pwd) && docker-compose exec nginx nginx -s reload") | crontab -
          echo "✅ Auto-renewal cron job configured"