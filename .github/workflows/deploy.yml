name: Deploy with SSL

on:
  push:
    branches: [ "app_integration_into_tg" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Remove problematic directories (without sudo)
        run: |
          # Удаляем только то, что можем без sudo
          rm -rf backend/.venv 2>/dev/null || true
          rm -rf frontend/node_modules 2>/dev/null || true
          rm -rf **/__pycache__ 2>/dev/null || true

      - name: Create necessary directories
        run: |
          mkdir -p certbot/{conf,www}
          mkdir -p nginx
          mkdir -p backend

      - name: Create .env from secrets
        run: |
          cat > backend/.env << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          ENDPOINT_URL=${{ secrets.ENDPOINT_URL }}
          BUCKET_NAME=${{ secrets.BUCKET_NAME }}
          URL_DATA_SAVE=${{ secrets.URL_DATA_SAVE }}
          EOF
          chmod 600 backend/.env

      - name: Check if SSL certificates exist
        id: check-certs
        run: |
          if [ -d "certbot/conf/live/wishlistprice.ru" ] && [ -f "certbot/conf/live/wishlistprice.ru/fullchain.pem" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ SSL certificates already exist"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No SSL certificates found - will obtain on first run"
          fi

      - name: Stop services
        run: |
          docker-compose down --remove-orphans || true
          docker stop nginx-temp 2>/dev/null || true
          docker rm nginx-temp 2>/dev/null || true

      - name: Obtain SSL certificates (ONLY FIRST TIME)
        if: steps.check-certs.outputs.exists == 'false'
        run: |
          echo "🔐 First time setup - obtaining SSL certificates..."
          chmod +x scripts/init-certs.sh
          ./scripts/init-certs.sh

      - name: Renew certificates if needed
        run: |
          echo "🔄 Checking if certificates need renewal..."
          docker run --rm \
            -v $(pwd)/certbot/conf:/etc/letsencrypt \
            -v $(pwd)/certbot/www:/var/www/certbot \
            certbot/certbot renew \
            --webroot -w /var/www/certbot \
            --quiet || true

      - name: Deploy with docker-compose
        run: |
          docker-compose up -d --build

      - name: Wait for services
        run: |
          echo "Waiting for services to start..."
          sleep 20
          docker-compose ps

      - name: Health check
        run: |
          if curl -f http://localhost/health 2>/dev/null; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            docker-compose logs --tail=50
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f backend/.env
          docker system prune -f --filter "until=24h" 2>/dev/null || true