name: Deploy to Production

on:
  push:
    branches: [ "app_integration_into_tg" ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Update code with git (без actions/checkout)
        run: |
          REPO_DIR="/home/runner/actions-runner/_work/telegram_wish_mini_app/telegram_wish_mini_app"
          REPO_URL="https://github.com/Konstanta202/telegram_wish_mini_app.git"
          BRANCH="app_integration_into_tg"
          
          if [ -d "$REPO_DIR/.git" ]; then
            echo "📦 Updating existing repository..."
            cd $REPO_DIR
            git fetch origin
            git reset --hard origin/$BRANCH
            # Очищаем только безопасные файлы, НЕ трогаем certbot
            git clean -fd -e certbot 2>/dev/null || true
          else
            echo "📦 Cloning repository..."
            mkdir -p $REPO_DIR
            cd /home/runner/actions-runner/_work/telegram_wish_mini_app
            git clone --branch $BRANCH $REPO_URL
          fi
          
          cd $REPO_DIR
          echo "✅ Current commit: $(git log -1 --oneline)"

      - name: Create .env from secrets
        run: |
          cd /home/runner/actions-runner/_work/telegram_wish_mini_app/telegram_wish_mini_app
          mkdir -p backend
          cat > backend/.env << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          ENDPOINT_URL=${{ secrets.ENDPOINT_URL }}
          BUCKET_NAME=${{ secrets.BUCKET_NAME }}
          URL_DATA_SAVE=${{ secrets.URL_DATA_SAVE }}
          EOF
          chmod 600 backend/.env

      - name: Create necessary directories
        run: |
          cd /home/runner/actions-runner/_work/telegram_wish_mini_app/telegram_wish_mini_app
          mkdir -p certbot/{conf,www}
          mkdir -p nginx

      - name: Stop old containers
        run: |
          cd /home/runner/actions-runner/_work/telegram_wish_mini_app/telegram_wish_mini_app
          docker-compose down --remove-orphans || true

      - name: Start new containers
        run: |
          cd /home/runner/actions-runner/_work/telegram_wish_mini_app/telegram_wish_mini_app
          docker-compose up -d --build

      - name: Wait for services
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 15

      - name: Health check
        run: |
          cd /home/runner/actions-runner/_work/telegram_wish_mini_app/telegram_wish_mini_app
          if curl -f http://localhost/health 2>/dev/null; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            docker-compose logs --tail=50
            exit 1
          fi

      - name: Show status
        run: |
          cd /home/runner/actions-runner/_work/telegram_wish_mini_app/telegram_wish_mini_app
          docker-compose ps
          echo "✅ Deployment completed successfully!"