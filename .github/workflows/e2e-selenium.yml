name: Selenium E2E Tests

on:
  push:
    branches: ["end_to_end_frontend", "main"]
  pull_request:
    branches: ["main", "app_integration_into_tg"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-e2e:
    name: Run Selenium E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: --shm-size=2gb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync SvelteKit
        working-directory: frontend
        run: npx svelte-kit sync || echo "SvelteKit sync skipped, continuing..."

      - name: Setup Docker Compose
        run: |
          docker compose version
          docker --version

      - name: Start backend and database
        run: |
          docker compose -f docker-compose.e2e.yaml up -d --build --wait
          docker compose -f docker-compose.e2e.yaml ps
        timeout-minutes: 10

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health || curl -s -f http://localhost:8000/docs; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          docker compose -f docker-compose.e2e.yaml logs backend
          exit 1

      - name: Show backend logs (for debugging)
        if: always()
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50 backend

      - name: Run Selenium E2E tests
        working-directory: frontend
        env:
          E2E_HEADLESS: "1"
          E2E_PAUSE_MS: "0"
          E2E_API_BASE_URL: "http://localhost:8000"
          E2E_SELENIUM_URL: "http://localhost:4444"
          E2E_MODE: "1"
        run: |
          # Ждём немного после запуска backend
          sleep 5
          npm run test:e2e

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: frontend/e2e/screenshots/
          retention-days: 14

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: |
            frontend/e2e/logs/
            frontend/test-results/
          retention-days: 14

      - name: Upload Docker logs
        if: always()
        run: |
          mkdir -p docker-logs
          docker compose -f docker-compose.e2e.yaml logs > docker-logs/docker-compose.log
        continue-on-error: true

      - name: Upload Docker logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 7

      - name: Stop Docker Compose environment
        if: always()
        run: docker compose -f docker-compose.e2e.yaml down -v