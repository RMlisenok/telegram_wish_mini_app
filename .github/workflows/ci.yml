# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  
jobs:
  # ==================== JOB 1: Build ====================
  build:
    name: 🔨 Build & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Check Python syntax
        run: |
          cd backend
          uv run python -m py_compile app/**/*.py tests/**/*.py
      
      - name: Run linter (ruff)
        run: |
          cd backend
          uv run ruff check app/ --output-format=github || true
      
      - name: Check type hints (mypy)
        run: |
          cd backend
          uv run mypy app/ --ignore-missing-imports || true
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-code
          path: backend/
          retention-days: 1

  # ==================== JOB 2: Unit Tests ====================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run unit tests
        run: |
          cd backend
          uv run pytest tests/unit/ -v --tb=short --junitxml=unit-test-results.xml
        env:
          TELEGRAM_BOT_TOKEN: test_token_12345
          SECRET_KEY: test_secret_key_for_tests
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASS: testpass
          DB_NAME: testdb
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          ENDPOINT_URL: http://localhost:9000
          BUCKET_NAME: test
          URL_DATA_SAVE: http://localhost:9000/test/
          TESTING: "true"

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/unit-test-results.xml
          retention-days: 7
      
      - name: Publish unit test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Unit Tests Report
          path: backend/unit-test-results.xml
          reporter: java-junit
          fail-on-error: false

  # ==================== JOB 3: Integration Tests ====================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: testuser
          MINIO_ROOT_PASSWORD: testpass123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          sleep 5
          echo "Waiting for MinIO..."
          sleep 5

      - name: Setup MinIO bucket
        run: |
          pip install mc
          mc alias set local http://localhost:9000 testuser testpass123
          mc mb local/test-bucket || true
          mc policy set download local/test-bucket

      - name: Run integration tests
        run: |
          cd backend
          uv run pytest tests/integration/ -v --tb=short --junitxml=integration-test-results.xml
        env:
          TELEGRAM_BOT_TOKEN: test_token_12345
          SECRET_KEY: test_secret_key_for_tests
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb
          S3_ACCESS_KEY: testuser
          S3_SECRET_KEY: testpass123
          ENDPOINT_URL: http://localhost:9000
          BUCKET_NAME: test-bucket
          URL_DATA_SAVE: http://localhost:9000/test-bucket/
          TESTING: "true"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/integration-test-results.xml
          retention-days: 7
      
      - name: Publish integration test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Integration Tests Report
          path: backend/integration-test-results.xml
          reporter: java-junit
          fail-on-error: false

  # ==================== JOB 4: Test Coverage ====================
  coverage:
    name: 📊 Test Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run tests with coverage
        run: |
          cd backend
          uv run pytest tests/unit/ tests/integration/ --cov=app --cov-branch --cov-report=xml --cov-report=html --cov-report=term
        env:
          TELEGRAM_BOT_TOKEN: test_token_12345
          SECRET_KEY: test_secret_key_for_tests
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          TEST_DATABASE_URL: sqlite+aiosqlite:///:memory:
          TESTING: "true"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7

  # ==================== JOB 5: Summary ====================
  summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, coverage]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## 🚀 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Lint | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some tests failed!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi