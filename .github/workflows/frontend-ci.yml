name: Frontend Tests

on:
  push:
    branches: ["unit_tests_frontend"]
  pull_request:
    branches: ["app_integration_into_tg", "unit_tests_frontend", "tests_frontend"]
  workflow_dispatch:

jobs:
  test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Generate SvelteKit types
        run: |
          cd frontend
          npx svelte-kit sync || true
      
      - name: Run tests with coverage
        run: |
          cd frontend
          npm test -- --coverage --ci --maxWorkers=2 --passWithNoTests
        env:
          NODE_OPTIONS: --experimental-vm-modules
          CI: true
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 30
      
      - name: Display coverage summary
        run: |
          if [ -f frontend/coverage/coverage-summary.json ]; then
            echo "Coverage Summary:"
            cat frontend/coverage/coverage-summary.json | jq '.total' 2>/dev/null || echo "jq not available"
          else
            echo "No coverage report found"
          fi
        continue-on-error: true
