name: Playwright Real E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-real-e2e:
    name: Run real Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run real Playwright E2E tests
        env:
          PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
          PW_UI_URL: ${{ secrets.PW_UI_URL }}
          PW_TEST_TOKEN: ${{ secrets.PW_TEST_TOKEN }}
          PW_TELEGRAM_USER_ID: ${{ secrets.PW_TELEGRAM_USER_ID }}
          PW_TELEGRAM_FIRST_NAME: ${{ secrets.PW_TELEGRAM_FIRST_NAME }}
          PW_TELEGRAM_INIT_DATA: ${{ secrets.PW_TELEGRAM_INIT_DATA }}
          PW_AUTH_PATH: ${{ secrets.PW_AUTH_PATH }}
          PW_TIMEOUT_MS: ${{ secrets.PW_TIMEOUT_MS }}
        run: npx playwright test -c playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30