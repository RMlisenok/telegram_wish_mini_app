name: telegram-wish-e2e

services:
  database:
    image: postgres:15
    container_name: telegram-wish-e2e-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: telegram_app_db
    ports:
      - "5437:5432"
    volumes:
      - e2e-database-data:/var/lib/postgresql/data
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: telegram-wish-e2e-backend
    env_file:
      - backend/.env.e2e
    environment:
      - E2E_MODE=1
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - e2e-network
    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  e2e-database-data:

networks:
  e2e-network:
    name: telegram-wish-e2e-network
    driver: bridge
